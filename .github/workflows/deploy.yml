# .github/workflows/deploy.yml
name: Deploy

on:
  # Manual-only. This job runs `supabase db push` and deploys edge functions
  # straight to a live project, so it must not fire automatically on push.
  # Re-enable a push trigger only once SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN
  # are set to the intended project for this org.
  workflow_dispatch:

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}